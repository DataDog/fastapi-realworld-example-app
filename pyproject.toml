# Project metadata now in [project] section below (PEP 621)

[dependency-groups]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.19.1",
  "pytest>=8.3.3",
  "pytest-cov>=7.0.0",
  "pytest-asyncio>=0.19.0,<=1.2.0",
  "pytest-env>=0.6.2,<=1.1.5",
  "pytest-xdist>=2.4.0",
  "httpx>=0.23.0",
  "asgi-lifespan>=2.1.0",
]

[tool.ruff.format]
# Formatter-specific settings
# The exclude list from [tool.ruff] is inherited automatically
# Additional formatter options can be added here if needed
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
force-sort-within-sections = true
known-first-party = [ "ddtrace" ]
relative-imports-order = "furthest-to-closest"

[tool.pytest.ini_options]
testpaths = "tests"
filterwarnings = [
  "error",
  "ignore::jwt.warnings.InsecureKeyLengthWarning",
  "ignore::passlib.exc.PasslibHashWarning",
  "ignore::DeprecationWarning:passlib.*",
  "ignore:'crypt' is deprecated:DeprecationWarning",
]
addopts = '''
  --strict-markers
  --tb=short
  --cov=app
  --cov=tests
  --cov-branch
  --cov-report=term-missing
  --cov-report=html
  --cov-report=xml
  --no-cov-on-fail
  --numprocesses=auto
  --asyncio-mode=auto
'''
env = [
  "SECRET_KEY=secret",
  "MAX_CONNECTIONS_COUNT=1",
  "MIN_CONNECTIONS_COUNT=1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
  "app",
  "tests",
  "alembic.ini",
  "setup.cfg",
]

[project]
name = "fastapi-realworld-example-app"
version = "0.0.0"
description = "Backend logic implementation for https://github.com/gothinkster/realworld with awesome FastAPI"
authors = [{name = "Nik Sidnev", email = "sidnev.nick@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.9,<3.15"
readme = "README.rst"
dependencies = [
  "ddtrace>=2.12",
  "uvicorn>=0.30.6,<=0.39.0",
  "fastapi>=0.114.1",
  "pydantic>=2.9.1,<=2.12.3",  # Pin to 2.12.3 for Python 3.14.0 compatibility (see github.com/pydantic/pydantic/issues/12501)
  "pydantic-settings>=2.5.2",
  "email-validator>=2.0.0",  # For pydantic email validation
  "python-dotenv>=1.0.0",    # For pydantic settings dotenv support
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.0.0,<5.0",
  "pyjwt>=2.4",
  "databases>=0.6.1",
  "asyncpg>=0.31.0",
  "psycopg2-binary>=2.9.3",
  "aiosql>=12.0",
  "pypika>=0.48.9",
  "alembic>=1.8",
  "python-slugify>=6.1",
  "Unidecode>=1.3",
  "loguru>=0.7.3",
  "greenlet>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.19.1",
  "pytest>=8.3.3",
  "pytest-cov>=7.0.0",
  "pytest-asyncio>=0.19.0,<=1.2.0",
  "pytest-env>=0.6.2,<=1.1.5",
  "pytest-xdist>=2.4.0",
  "httpx>=0.23.0",
  "asgi-lifespan>=2.1.0",
]
