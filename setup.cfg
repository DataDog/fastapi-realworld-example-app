[coverage:report]
precision = 2
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    raise NotImplemented

[coverage:run]
source = app
branch = True

[mypy]
plugins = pydantic.mypy

strict_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_any_generics = True
check_untyped_defs = True

disallow_untyped_defs = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
warn_untyped_fields = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-loguru.*]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-bcrypt.*]
ignore_missing_imports = True

[mypy-slugify.*]
ignore_missing_imports = True

[mypy-pypika.*]
ignore_missing_imports = True

[mypy-app.db.queries.tables]
# PyPika has incomplete type stubs
disable_error_code = arg-type

[mypy-app.db.migrations.*]
# Alembic migrations have type issues
ignore_errors = True

[mypy-app.core.settings.base]
# Python 3.11+ Enum typing changes
disable_error_code = misc

[mypy-app.core.settings.app]
# Pydantic v2 ConfigDict typing
disable_error_code = assignment

[mypy-app.db.repositories.articles]
# PyPika query builder has incomplete type stubs
disable_error_code = arg-type
