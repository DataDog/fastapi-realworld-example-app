services:
  app:
    build: .
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db/postgres}
      DD_TRACE_AGENT_URL: ${DD_TRACE_AGENT_URL:-http://ddagent:8126}
      SECRET_KEY: ${SECRET_KEY:-insecure-dev-key-change-in-production}
      APP_ENV: ${APP_ENV:-dev}
    depends_on:
      - db
      - ddagent
  ddagent:
      image: datadog/agent:latest
      environment:
          - DD_HOSTNAME=github-actions-worker
          - DD_BIND_HOST=0.0.0.0
          - DD_SITE=${DD_SITE-datadoghq.com}
          - DD_API_KEY=${DD_API_KEY-invalid_but_this_is_fine}
          - DD_APM_RECEIVER_SOCKET=/tmp/ddagent/trace.sock
          - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      ports:
          - 8126:8126
          - 8125:8125/udp
      volumes:
        - ddagent:/tmp/ddagent:rw
  db:
    image: postgres:11.5-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data:cached
volumes:
    ddagent: