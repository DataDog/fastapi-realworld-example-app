name: API spec

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '00 04 * * 2-6'

jobs:
  api-spec:
    name: API spec tests

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:11.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        # Install via pipx so Hatch runs under the runner's default Python
        # (3.12+ -> Hatch 1.17+), independent of the matrix Python. Installing
        # under the matrix Python forces Hatch 1.15.1 on the 3.9 job (Hatch
        # dropped 3.9 in 1.16), and 1.15.1 is incompatible with virtualenv
        # >=20.29. Hatch still discovers the matrix interpreter as the target.
        run: pipx install hatch

      - name: Setup environment and run API spec tests
        env:
          SECRET_KEY: secret_key
          DATABASE_URL: postgresql://postgres:postgres@localhost/postgres
        run: ./scripts/run-postman ${{ matrix.python-version }}
